<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR POS System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- LEFT PANEL (Form) -->
    <div class="left-panel">
        <h2>QR Generator</h2>

        <form id="qr-form" class="form-card">

            <label>Product ID</label>
            <input type="text" id="qr-id" placeholder="Enter Product ID">

            <label>Price</label>
            <input type="text" id="qr-price" placeholder="Enter Price">

            <button type="submit" class="btn primary">Generate QR</button>

            <button type="button" id="download-btn" class="btn secondary">
                Download QR
            </button>

        </form>
    </div>

    <!-- RIGHT PANEL (Preview) -->
    <div class="right-panel">

        <h2>QR Preview</h2>

        <div id="qr-result" class="qr-box">
            <p>No QR generated yet</p>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
